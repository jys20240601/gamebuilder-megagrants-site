    h += '<div class="it"><div class="t">' + (r.s ? '<span class="st">★</span>' : '') + hl(r.t) + '</div><div class="d">' + hl(r.d) + '</div><div class="e">' + hl(r.e) + '</div></div>';
  });
  document.getElementById('list').innerHTML = h || '<p class="lead">맞는 용어가 없습니다.</p>';
}
document.getElementById('q').addEventListener('input', e => { q = e.target.value.trim(); render(); });
document.getElementById('star').onclick = e => { starOnly = !starOnly; e.target.setAttribute('aria-pressed', String(starOnly)); render(); };
render();
</script>
</main>
</body>
