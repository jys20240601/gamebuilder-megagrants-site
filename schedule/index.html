<!doctype html>
<html lang="ko" data-design="A" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://cdn.jsdelivr.net https://fonts.gstatic.com; connect-src https://www.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f4f1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyPlanner">
<title>MyPlanner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css?v=11">
</head>
<body>
<div class="app" id="app">
  <div class="list-col" id="list-col">
    <header class="hdr">
      <div class="hdr-text"><span class="hdr-sub" id="hdr-sub"></span><h1 class="hdr-title" id="hdr-title">오늘</h1>
      <button class="gear" id="open-settings" type="button" aria-label="설정" title="설정 열기">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 6.5h8M15 6.5h1.5M3.5 13.5h1.5M8.5 13.5h8M13 4.7a1.8 1.8 0 1 1 0 3.6a1.8 1.8 0 0 1 0-3.6zM6.7 11.7a1.8 1.8 0 1 1 0 3.6a1.8 1.8 0 0 1 0-3.6z"/></svg>
      </button></div>
      <button class="sync" id="sync" type="button"></button>
    </header>
    <div id="banner"></div>
    <main class="scroll" id="list-scroll">
      <section id="view-cal" class="view"></section>
      <section id="view-tasks" class="view" hidden></section>
      <section id="view-goals" class="view" hidden></section>
      <section id="view-notes" class="view" hidden></section>
    </main>
    <nav class="tabs" aria-label="화면">
      <button type="button" class="tab" id="tab-cal" data-tab="cal" aria-current="page">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5.5 4.5h9A2.5 2.5 0 0 1 17 7v7.5a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 3 14.5V7a2.5 2.5 0 0 1 2.5-2.5zM3 8.5h14M7 3v3M13 3v3"/></svg>
        <span>일정</span>
      </button>
      <button type="button" class="tab" id="tab-tasks" data-tab="tasks">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 3.5h5a4 4 0 0 1 4 4v5a4 4 0 0 1-4 4h-5a4 4 0 0 1-4-4v-5a4 4 0 0 1 4-4zM7 10l2.2 2.2L13.3 8"/></svg>
        <span>할 일</span>
      </button>
      <button type="button" class="tab" id="tab-goals" data-tab="goals">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM10 6.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7zM10 9.6v.8"/></svg>
        <span>목표</span>
      </button>
      <button type="button" class="tab" id="tab-notes" data-tab="notes">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 4.5H8A2 2 0 0 1 10 6.5V16a1.5 1.5 0 0 0-1.5-1.5h-5zM16.5 4.5H12a2 2 0 0 0-2 2V16a1.5 1.5 0 0 1 1.5-1.5h5z"/></svg>
        <span>메모</span>
      </button>
    </nav>
    <button class="fab" id="fab" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg><span id="fab-label">할 일</span>
    </button>
    <section class="arch" id="arch" hidden aria-label="보관함"></section>
  </div>

  <div class="pane-col" id="pane-col">
    <div class="pane-empty"><strong>선택한 항목이 없어요</strong><span>왼쪽 목록에서 고르면 여기에서 읽고 편집해요.</span></div>
    <section class="page detail" id="detail" hidden aria-label="상세"></section>
    <section class="page editor" id="editor" hidden aria-label="편집"></section>
    <section class="page settings" id="settings" hidden aria-label="설정"></section>
  </div>
</div>

<div class="cf" id="cf" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="app.js?v=11"></script>
</body>
</html>
